<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Gloock"; src: url("assets/fonts/Gloock-Regular.ttf"); }
      @font-face { font-family: "Jura"; font-weight: 300; src: url("assets/fonts/Jura-Light.ttf"); }
      @font-face { font-family: "Jura"; font-weight: 500; src: url("assets/fonts/Jura-Medium.ttf"); }
      :root {
        --nuit: #1b1f3b; --creme: #f3ebdd; --or: #c9a46a; --cuivre: #b5713e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 42%, #272c55 0%, #1b1f3b 55%, #12152b 100%);
      }
      #stars, #orbits { position: absolute; inset: 0; }
      .star { position: absolute; border-radius: 50%; background: var(--creme); }
      #medal {
        position: absolute; left: 290px; top: 470px; width: 500px; height: 500px;
      }
      
      #medal-ring {
        position: absolute; left: 266px; top: 446px; width: 548px; height: 548px;
      }
      #title {
        position: absolute; left: 0; right: 0; top: 1090px; text-align: center;
        font-family: "Gloock", serif; font-size: 150px; color: var(--creme); letter-spacing: -1px;
      }
      #title span { display: inline-block; }
      #tagline {
        position: absolute; left: 0; right: 0; top: 1300px; text-align: center;
        font-family: "Jura", sans-serif; font-weight: 300; font-size: 54px; color: var(--or);
      }
      #rule {
        position: absolute; left: 390px; top: 1400px; width: 300px; height: 2px;
        background: var(--or); transform-origin: 50% 50%;
      }
      #handle {
        position: absolute; left: 50%; top: 1460px; transform: translateX(-50%);
        padding: 22px 52px; border: 2px solid var(--or); border-radius: 60px;
        font-family: "Jura", sans-serif; font-weight: 500; font-size: 40px; letter-spacing: 4px;
        color: var(--creme); white-space: nowrap;
      }
      .sparkle { position: absolute; width: 60px; height: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5"
         data-width="1080" data-height="1920">

      <div id="stars" class="clip" data-start="0" data-duration="4.5" data-track-index="0"></div>

      <svg id="orbits" data-layout-allow-overflow class="clip" data-start="0" data-duration="4.5" data-track-index="1"
           viewBox="0 0 1080 1920">
        <g transform="rotate(-14 540 720)">
          <ellipse id="orbit1" cx="540" cy="720" rx="470" ry="150" fill="none" stroke="#c9a46a" stroke-width="2.5" opacity="0.85"/>
          <ellipse id="orbit2" cx="540" cy="720" rx="620" ry="215" fill="none" stroke="#c9a46a" stroke-width="1.5" opacity="0.35"/>
        </g>
        <circle id="moon" cx="0" cy="0" r="16" fill="#f3ebdd"/>
      </svg>

      <svg id="medal-ring" class="clip" data-start="0" data-duration="4.5" data-track-index="2"
           viewBox="0 0 548 548">
        <circle id="ring" cx="274" cy="274" r="270" fill="none" stroke="#c9a46a" stroke-width="3"/>
      </svg>

      <img id="medal" class="clip" data-start="0" data-duration="4.5" data-track-index="3"
           src="assets/astronori-medaillon.png" alt="AstroNori" />

      <svg id="spark1" class="sparkle clip" data-start="0" data-duration="4.5" data-track-index="4"
           style="left:800px; top:430px" viewBox="-30 -30 60 60">
        <path d="M0,-28 L5,-5 L28,0 L5,5 L0,28 L-5,5 L-28,0 L-5,-5 Z" fill="#c9a46a"/>
      </svg>
      <svg id="spark2" class="sparkle clip" data-start="0" data-duration="4.5" data-track-index="5"
           style="left:230px; top:930px; width:36px; height:36px" viewBox="-30 -30 60 60">
        <path d="M0,-28 L5,-5 L28,0 L5,5 L0,28 L-5,5 L-28,0 L-5,-5 Z" fill="#f3ebdd"/>
      </svg>

      <h1 id="title" class="clip" data-start="0" data-duration="4.5" data-track-index="6"><span>A</span><span>s</span><span>t</span><span>r</span><span>o</span><span>N</span><span>o</span><span>r</span><span>i</span></h1>
      <div id="tagline" class="clip" data-start="0" data-duration="4.5" data-track-index="7">L'univers en 1 minute</div>
      <div id="rule" class="clip" data-start="0" data-duration="4.5" data-track-index="8"></div>
      <div id="handle" class="clip" data-start="0" data-duration="4.5" data-track-index="9">@ASTRO.NORI</div>
    </div>

    <script>
      // Étoiles déterministes (même rendu à chaque image)
      (function () {
        let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
        const box = document.getElementById("stars");
        for (let i = 0; i < 170; i++) {
          const d = document.createElement("div");
          const r = rnd() < 0.12 ? 4 : rnd() < 0.5 ? 2.5 : 1.6;
          d.className = "star tw" + (i % 3);
          d.style.cssText = `left:${rnd() * 1080}px;top:${rnd() * 1920}px;width:${r}px;height:${r}px;opacity:${0.35 + rnd() * 0.6}`;
          box.appendChild(d);
        }
      })();

      const tl = gsap.timeline({ paused: true });
      const len1 = 2 * Math.PI * Math.sqrt((470 * 470 + 150 * 150) / 2);
      const len2 = 2 * Math.PI * Math.sqrt((620 * 620 + 215 * 215) / 2);
      const lenR = 2 * Math.PI * 270;

      gsap.set("#orbit1", { strokeDasharray: len1, strokeDashoffset: len1 });
      gsap.set("#orbit2", { strokeDasharray: len2, strokeDashoffset: len2 });
      gsap.set("#ring", { strokeDasharray: lenR, strokeDashoffset: lenR, rotate: -90, transformOrigin: "50% 50%" });

      // 1. Le ciel s'allume
      tl.from("#stars", { opacity: 0, duration: 0.8, ease: "power1.out" }, 0);
      // 2. Les orbites se dessinent
      tl.to("#orbit1", { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 0.1);
      tl.to("#orbit2", { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, 0.25);
      // 3. Médaillon : cercle d'or puis AstroNori apparaît en douceur
      tl.to("#ring", { strokeDashoffset: 0, duration: 1.0, ease: "power3.inOut" }, 0.35);
      tl.from("#medal", { scale: 0.6, opacity: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.75);
      // Petite lune qui orbite
      const moon = { a: 200 };
      tl.to(moon, {
        a: 560, duration: 4.2, ease: "none",
        onUpdate() {
          const t = (moon.a * Math.PI) / 180, k = (-14 * Math.PI) / 180;
          const x = 470 * Math.cos(t), y = 150 * Math.sin(t);
          gsap.set("#moon", { attr: { cx: 540 + x * Math.cos(k) - y * Math.sin(k), cy: 720 + x * Math.sin(k) + y * Math.cos(k) } });
        },
      }, 0.3);
      tl.from("#moon", { opacity: 0, duration: 0.4 }, 0.9);
      // 4. Scintillements
      tl.from("#spark1", { scale: 0, rotate: -90, duration: 0.6, ease: "back.out(2)", transformOrigin: "50% 50%" }, 1.25);
      tl.from("#spark2", { scale: 0, rotate: 90, duration: 0.5, ease: "back.out(2)", transformOrigin: "50% 50%" }, 1.45);
      // 5. Le nom, lettre par lettre
      tl.from("#title span", { y: 60, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.05 }, 1.3);
      // 6. Slogan, trait, pseudo
      tl.from("#tagline", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 1.95);
      tl.from("#rule", { scaleX: 0, duration: 0.6, ease: "power2.inOut" }, 2.1);
      tl.from("#handle", { opacity: 0, y: 24, duration: 0.6, ease: "power2.out" }, 2.35);
      // 7. Tenue finale (lumière douce sur le médaillon)
      tl.to("#medal", { scale: 1.03, duration: 1.6, ease: "sine.inOut" }, 2.9);
      tl.to({}, { duration: 0.01 }, 4.49);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
